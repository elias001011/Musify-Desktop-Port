name: Build Musify Cloud Debug APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or SHA to build
        required: false
        default: mobile-cloud-sync
        type: string
  push:
    branches:
      - mobile-cloud-sync

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Resolve Flutter version
        id: flutter-version
        shell: bash
        run: |
          flutter_version="$(grep -E '^[[:space:]]*flutter:[[:space:]]*\^?[0-9.]+' pubspec.yaml | head -1 | sed -E 's/^[[:space:]]*flutter:[[:space:]]*\^?//')"
          flutter_version="${flutter_version:-3.x}"
          echo "version=${flutter_version}" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - run: flutter pub get

      - run: flutter analyze .

      - name: Build debug APK
        env:
          MUSIFY_CLOUD_SYNC_URL: ${{ vars.MUSIFY_CLOUD_SYNC_URL }}
        run: |
          flutter build apk \
            --debug \
            --flavor github \
            --dart-define=MUSIFY_CLOUD_SYNC_URL="${MUSIFY_CLOUD_SYNC_URL}"

      - uses: actions/upload-artifact@v7
        with:
          name: MusifyCloud-debug.apk
          path: build/app/outputs/flutter-apk/app-github-debug.apk
