name: Sync Mobile Upstream Release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream Musify tag to sync. Leave empty for latest release.
        required: false
        type: string
  schedule:
    # Run once a week on Sunday at 03:17
    - cron: "17 3 * * 0"

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: sync-mobile-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream and dispatch mobile release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v5
        with:
          ref: refs/heads/mobile-cloud-sync
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        shell: bash
        run: |
          if [[ -n "$INPUT_UPSTREAM_TAG" ]]; then
            upstream_tag="$INPUT_UPSTREAM_TAG"
          else
            upstream_tag="$(gh release view --repo gokadzev/Musify --json tagName --jq '.tagName')"
          fi

          version="${upstream_tag#v}"
          release_tag="mobile-v${version}"

          echo "tag=${upstream_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Stop if mobile release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="${{ steps.upstream.outputs.release_tag }}"

          if ! gh release view "$release_tag" --json assets >/tmp/mobile_release.json 2>/dev/null; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          asset_count="$(jq '[.assets[] | select(.name == "MusifyCloud.apk" or .name == "MusifyCloud-arm64-v8a.apk")] | length' /tmp/mobile_release.json)"
          if [[ "$asset_count" -ge 2 ]]; then
            echo "Mobile release $release_tag already has APK assets."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Mobile release $release_tag exists but is incomplete; release workflow will repair it."
            echo "exists=incomplete" >> "$GITHUB_OUTPUT"
          fi

      - name: Add upstream remote
        if: steps.existing.outputs.exists != 'true'
        run: |
          git remote add upstream https://github.com/gokadzev/Musify.git || git remote set-url upstream https://github.com/gokadzev/Musify.git
          git fetch upstream --no-tags --prune "+refs/tags/${{ steps.upstream.outputs.tag }}:refs/tags/${{ steps.upstream.outputs.tag }}"

      # A plain merge only. Automatic -X ours / -X theirs resolution hides real
      # conflicts: it can keep Musify Cloud code that calls a refactored upstream
      # API, or drop an upstream fix. Conflicts need a human.
      - name: Merge upstream release
        id: merge
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          upstream_tag="${{ steps.upstream.outputs.tag }}"

          if git merge --no-edit "refs/tags/${upstream_tag}"; then
            echo "Merged upstream ${upstream_tag} without conflicts."
            exit 0
          fi

          {
            echo "### Conflicts merging upstream \`${upstream_tag}\` into \`mobile-cloud-sync\`"
            echo
            echo "Resolve these files by hand and push to \`mobile-cloud-sync\`:"
            echo
            git diff --name-only --diff-filter=U | sed 's/^/- `/;s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

          git merge --abort
          exit 1

      - name: Set up Java
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Resolve Flutter version
        if: steps.existing.outputs.exists != 'true'
        id: flutter-version
        shell: bash
        run: |
          flutter_version="$(grep -E '^[[:space:]]*flutter:[[:space:]]*\^?[0-9.]+' pubspec.yaml | head -1 | sed -E 's/^[[:space:]]*flutter:[[:space:]]*\^?//')"
          flutter_version="${flutter_version:-3.x}"
          echo "version=${flutter_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        if: steps.existing.outputs.exists != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: Refresh generated version
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          chmod +x update.sh
          ./update.sh
          if ! git diff --quiet lib/constants/version.dart; then
            git add lib/constants/version.dart
            git commit -m "chore: refresh version constant for ${{ steps.upstream.outputs.tag }}"
          fi

      # Upstream can add or bump dependencies without the merge touching
      # pubspec.lock, so refresh the lockfile and keep it in the branch.
      - name: Refresh pubspec.lock
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          flutter pub get
          if ! git diff --quiet pubspec.lock; then
            git add pubspec.lock
            git commit -m "chore: refresh pubspec.lock for ${{ steps.upstream.outputs.tag }}"
          fi

      # The gate that matters: never push a tree that does not analyze clean,
      # because the release build would fail afterwards on an already-pushed branch.
      - name: Validate merged source
        if: steps.existing.outputs.exists != 'true'
        run: flutter analyze

      - name: Push mobile branch
        id: push
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          git push origin HEAD:refs/heads/mobile-cloud-sync
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch mobile release build
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          repair="false"
          if [[ "${{ steps.existing.outputs.exists }}" == "incomplete" ]]; then
            repair="true"
          fi

          gh workflow run mobile_release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref refs/heads/mobile-cloud-sync \
            -f version="${{ steps.upstream.outputs.version }}" \
            -f source_ref="${{ steps.push.outputs.sha }}" \
            -f repair_existing_release="$repair"

      - name: Report failure
        if: failure() && steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          PUSHED: ${{ steps.push.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [[ "${MERGE_OUTCOME}" == "failure" ]]; then
            reason="the merge hit conflicts"
          elif [[ "${PUSHED}" == "success" ]]; then
            reason="mobile-cloud-sync was pushed but the release dispatch failed"
          else
            reason="the merged tree did not pass flutter analyze, so nothing was pushed"
          fi

          {
            echo "### Mobile upstream sync failed for \`${UPSTREAM_TAG:-unknown}\`"
            echo
            echo "Reason: ${reason}."
          } >> "$GITHUB_STEP_SUMMARY"

          cat > /tmp/sync-failure.md <<NOTE
          Automatic mobile sync from gokadzev/Musify ${UPSTREAM_TAG:-unknown upstream tag} failed because ${reason}.

          Resolve it on \`mobile-cloud-sync\` locally, make sure \`flutter analyze\` is clean, push, then dispatch \`mobile_release.yml\`.

          Run: ${RUN_URL}
          NOTE

          # Best effort: issue creation can be unavailable for the workflow token.
          gh issue create \
            --title "[SYNC FAILED] Mobile upstream sync failed for ${UPSTREAM_TAG:-unknown upstream tag}" \
            --body-file /tmp/sync-failure.md \
            || echo "Could not open an issue; see the run summary above."
