name: Sync Musify AI from Musify Cloud

# Musify AI is Musify Cloud plus the assistant, so it tracks the
# mobile-cloud-sync branch rather than upstream directly: mobile-cloud-sync has
# already resolved the upstream merge and passed its own analyze gate, which
# means this branch only ever sees one class of conflict (Cloud vs AI) instead
# of two.
#
# Deliberately release-triggered and not scheduled. A cron would re-run and
# re-fail on every tick for the same unresolved conflict; keying off a published
# mobile-v* release means the sync fires exactly once per Cloud release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      cloud_ref:
        description: mobile-cloud-sync ref to merge. Leave empty for the branch head.
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: sync-ai-from-cloud
  cancel-in-progress: false

jobs:
  sync:
    name: Merge Musify Cloud and dispatch the Musify AI release
    runs-on: ubuntu-latest

    steps:
      # The `release` event has no tag filter (unlike `push`, there is no
      # `tags:` key for it), so every published release starts this workflow and
      # the gate has to reject the ones that are not a Musify Cloud release.
      - name: Gate on a published mobile-v* release
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            if [[ "$RELEASE_TAG" != mobile-v* ]]; then
              echo "Release ${RELEASE_TAG} is not a Musify Cloud release; nothing to sync."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Musify Cloud released ${RELEASE_TAG}; syncing it into Musify AI."
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout the Musify AI branch
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          ref: refs/heads/feature/musify-ai
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # A plain merge only. Automatic -X ours / -X theirs resolution hides real
      # conflicts: it can keep AI code that calls a refactored Cloud API, or
      # drop a Cloud fix. Conflicts need a human.
      - name: Merge Musify Cloud
        id: merge
        if: steps.gate.outputs.skip != 'true'
        env:
          CLOUD_REF: ${{ inputs.cloud_ref }}
        shell: bash
        run: |
          cloud_ref="${CLOUD_REF:-mobile-cloud-sync}"
          git fetch origin "$cloud_ref"

          if git merge --no-edit FETCH_HEAD; then
            echo "Merged ${cloud_ref} without conflicts."
            exit 0
          fi

          {
            echo "### Conflicts merging \`${cloud_ref}\` into \`feature/musify-ai\`"
            echo
            echo "Resolve these files by hand and push to \`feature/musify-ai\`:"
            echo
            git diff --name-only --diff-filter=U | sed 's/^/- `/;s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

          git merge --abort
          exit 1

      - name: Set up Java
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Resolve Flutter version
        id: flutter-version
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          flutter_version="$(grep -E '^[[:space:]]*flutter:[[:space:]]*\^?[0-9.]+' pubspec.yaml | head -1 | sed -E 's/^[[:space:]]*flutter:[[:space:]]*\^?//')"
          flutter_version="${flutter_version:-3.x}"
          echo "version=${flutter_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        if: steps.gate.outputs.skip != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: Refresh generated version
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          chmod +x update.sh
          ./update.sh
          if ! git diff --quiet lib/constants/version.dart; then
            git add lib/constants/version.dart
            git commit -m "chore: refresh version constant after the Musify Cloud sync"
          fi

      # Cloud can add or bump dependencies without the merge touching
      # pubspec.lock, so refresh the lockfile and keep it in the branch.
      - name: Refresh pubspec.lock
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          flutter pub get
          if ! git diff --quiet pubspec.lock; then
            git add pubspec.lock
            git commit -m "chore: refresh pubspec.lock after the Musify Cloud sync"
          fi

      # Read the version from the merged tree, not from the release tag: after a
      # manual dispatch there is no tag to read, and after a release trigger the
      # merged pubspec is what the release workflow will validate the tag against.
      - name: Resolve the app version
        id: version
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          version="$(sed -n 's/^version: \([^ +]*\).*/\1/p' pubspec.yaml)"
          if [[ -z "$version" ]]; then
            echo "Could not read the app version from pubspec.yaml." >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=musifyai-v${version}" >> "$GITHUB_OUTPUT"

      # The gate that matters: never push a tree that does not analyze clean,
      # because the release build would fail afterwards on an already-pushed
      # branch.
      - name: Validate merged source
        if: steps.gate.outputs.skip != 'true'
        run: flutter analyze

      - name: Push the Musify AI branch
        id: push
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          git push origin HEAD:refs/heads/feature/musify-ai
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The merge above is worth keeping even when the release already exists,
      # so this only gates the release build, not the push.
      - name: Check whether the Musify AI release already exists
        id: existing
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="${{ steps.version.outputs.release_tag }}"

          if ! gh release view "$release_tag" --json assets >/tmp/ai_release.json 2>/dev/null; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          asset_count="$(jq '[.assets[] | select(.name == "MusifyAI.apk" or .name == "MusifyAI-arm64-v8a.apk")] | length' /tmp/ai_release.json)"
          if [[ "$asset_count" -ge 2 ]]; then
            echo "Musify AI release $release_tag already has APK assets; not rebuilding."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Musify AI release $release_tag exists but is incomplete; the release workflow will repair it."
            echo "exists=incomplete" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch the Musify AI release build
        if: steps.gate.outputs.skip != 'true' && steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          repair="false"
          if [[ "${{ steps.existing.outputs.exists }}" == "incomplete" ]]; then
            repair="true"
          fi

          gh workflow run musifyai_release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref refs/heads/feature/musify-ai \
            -f version="${{ steps.version.outputs.version }}" \
            -f source_ref="${{ steps.push.outputs.sha }}" \
            -f repair_existing_release="$repair"

      - name: Report failure
        if: failure() && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          PUSHED: ${{ steps.push.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [[ "${MERGE_OUTCOME}" == "failure" ]]; then
            reason="the merge hit conflicts"
          elif [[ "${PUSHED}" == "success" ]]; then
            reason="feature/musify-ai was pushed but the release dispatch failed"
          else
            reason="the merged tree did not pass flutter analyze, so nothing was pushed"
          fi

          {
            echo "### Musify AI sync failed for \`${VERSION:-unknown}\`"
            echo
            echo "Reason: ${reason}."
          } >> "$GITHUB_STEP_SUMMARY"

          cat > /tmp/sync-failure.md <<NOTE
          Automatic sync of mobile-cloud-sync into feature/musify-ai for ${VERSION:-unknown} failed because ${reason}.

          Resolve it on \`feature/musify-ai\` locally, make sure \`flutter analyze\` is clean, push, then dispatch \`musifyai_release.yml\`.

          Run: ${RUN_URL}
          NOTE

          # Best effort: issue creation can be unavailable for the workflow token.
          gh issue create \
            --title "[SYNC FAILED] Musify AI sync failed for ${VERSION:-unknown}" \
            --body-file /tmp/sync-failure.md \
            || echo "Could not open an issue; see the run summary above."
