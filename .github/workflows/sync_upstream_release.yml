name: Sync Upstream Release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream Musify release tag. Empty means latest release."
        required: false
      release_after_sync:
        description: "Dispatch desktop release workflow after a successful sync. Use true or false."
        required: false
        default: "true"
  schedule:
    - cron: "23 */6 * * *"

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    name: Sync latest gokadzev/Musify release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout desktop port
        uses: actions/checkout@v5
        with:
          ref: refs/heads/master
          fetch-depth: 0
          fetch-tags: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_UPSTREAM_TAG: ${{ github.event.inputs.upstream_tag }}
          INPUT_RELEASE_AFTER_SYNC: ${{ github.event.inputs.release_after_sync }}
        run: |
          release_after_sync="${INPUT_RELEASE_AFTER_SYNC:-true}"
          if [[ "${release_after_sync}" != "true" && "${release_after_sync}" != "false" ]]; then
            echo "release_after_sync must be true or false." >&2
            exit 1
          fi

          if [[ -n "${INPUT_UPSTREAM_TAG}" ]]; then
            upstream_tag="$(gh release view "${INPUT_UPSTREAM_TAG}" --repo gokadzev/Musify --json tagName --jq .tagName)"
          else
            upstream_tag="$(gh release view --repo gokadzev/Musify --json tagName --jq .tagName)"
          fi

          desktop_tag="desktop-v${upstream_tag#v}"
          required_assets=(
            "Musify-linux-x64.deb"
            "Musify-linux-x64.tar.gz"
            "Musify-windows-x64-setup.exe"
            "Musify-windows-x64-portable.zip"
            "SHA256SUMS.txt"
          )

          echo "upstream_tag=${upstream_tag}" >> "$GITHUB_OUTPUT"
          echo "desktop_tag=${desktop_tag}" >> "$GITHUB_OUTPUT"
          echo "release_after_sync=${release_after_sync}" >> "$GITHUB_OUTPUT"

          if gh release view "${desktop_tag}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${desktop_tag}" --json isDraft --jq .isDraft)"
            mapfile -t existing_assets < <(gh release view "${desktop_tag}" --json assets --jq '.assets[].name')
            missing_assets=()

            for required_asset in "${required_assets[@]}"; do
              found=false
              for existing_asset in "${existing_assets[@]}"; do
                if [[ "${existing_asset}" == "${required_asset}" ]]; then
                  found=true
                  break
                fi
              done

              if [[ "${found}" != "true" ]]; then
                missing_assets+=("${required_asset}")
              fi
            done

            if [[ "${is_draft}" == "false" && "${#missing_assets[@]}" -eq 0 ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "repair_existing_release=false" >> "$GITHUB_OUTPUT"
              echo "Desktop release ${desktop_tag} already exists with all expected assets."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "repair_existing_release=true" >> "$GITHUB_OUTPUT"
              echo "Desktop release ${desktop_tag} exists but needs repair."
              echo "Draft: ${is_draft}"
              printf 'Missing assets: %s\n' "${missing_assets[*]:-none}"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "repair_existing_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when already released
        if: ${{ steps.release.outputs.skip == 'true' }}
        run: echo "No new upstream release to package."

      - name: Add upstream remote
        if: ${{ steps.release.outputs.skip != 'true' }}
        run: |
          git remote add upstream https://github.com/gokadzev/Musify.git || git remote set-url upstream https://github.com/gokadzev/Musify.git
          git fetch upstream --no-tags --prune "+refs/tags/${{ steps.release.outputs.upstream_tag }}:refs/tags/${{ steps.release.outputs.upstream_tag }}"

      - name: Install Linux build dependencies
        if: ${{ steps.release.outputs.skip != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev dpkg-dev

      - name: Merge upstream release
        if: ${{ steps.release.outputs.skip != 'true' }}
        run: |
          git merge --no-edit "refs/tags/${{ steps.release.outputs.upstream_tag }}"

      - name: Resolve Flutter version
        if: ${{ steps.release.outputs.skip != 'true' }}
        run: |
          flutter_version="$(sed -n 's/^  flutter: //p' pubspec.yaml | sed 's/^\^//')"
          echo "FLUTTER_VERSION=${flutter_version}" >> "$GITHUB_ENV"

      - name: Set up Flutter
        if: ${{ steps.release.outputs.skip != 'true' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "${{ env.FLUTTER_VERSION }}"

      - name: Refresh generated version and dependencies
        if: ${{ steps.release.outputs.skip != 'true' }}
        run: |
          chmod +x update.sh
          ./update.sh
          flutter pub get

      - name: Validate synced desktop version
        if: ${{ steps.release.outputs.skip != 'true' }}
        run: |
          expected_version="${{ steps.release.outputs.desktop_tag }}"
          expected_version="${expected_version#desktop-v}"
          actual_version="$(sed -n 's/^version: \([^ +]*\).*/\1/p' pubspec.yaml)"

          if [[ -z "${actual_version}" ]]; then
            echo "Could not resolve app version from pubspec.yaml." >&2
            exit 1
          fi

          if [[ "${actual_version}" != "${expected_version}" ]]; then
            echo "Upstream tag ${{ steps.release.outputs.upstream_tag }} maps to desktop-v${expected_version}, but pubspec.yaml is ${actual_version}." >&2
            exit 1
          fi

      - name: Analyze synced code
        if: ${{ steps.release.outputs.skip != 'true' }}
        run: flutter analyze

      - name: Build Linux smoke test
        if: ${{ steps.release.outputs.skip != 'true' }}
        run: flutter build linux --release --dart-define=MUSIFY_CLOUD_SYNC_URL="${{ vars.MUSIFY_CLOUD_SYNC_URL }}"

      - name: Commit generated sync updates
        if: ${{ steps.release.outputs.skip != 'true' }}
        run: |
          if ! git diff --quiet; then
            git add -A
            git commit -m "Refresh desktop port after upstream ${{ steps.release.outputs.upstream_tag }}"
          fi

      - name: Push synced master
        if: ${{ steps.release.outputs.skip != 'true' }}
        run: git push origin HEAD:refs/heads/master

      - name: Dispatch desktop release workflow
        if: ${{ steps.release.outputs.skip != 'true' && steps.release.outputs.release_after_sync != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_TAG: ${{ steps.release.outputs.desktop_tag }}
        run: |
          gh workflow run desktop_release.yml \
            --ref refs/heads/master \
            -f tag="${DESKTOP_TAG}" \
            -f repair_existing_release="${{ steps.release.outputs.repair_existing_release }}" \
            -f prerelease=false

      - name: Open sync failure issue
        if: ${{ failure() && steps.release.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.release.outputs.upstream_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Upstream sync failed for ${UPSTREAM_TAG}" \
            --body "Automatic sync from gokadzev/Musify ${UPSTREAM_TAG} failed. Run: ${RUN_URL}" || true
