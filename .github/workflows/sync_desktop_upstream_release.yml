name: Sync Desktop Upstream Release

on:
  schedule:
    # Run once a week on Sunday at 03:17
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream Musify tag to sync. Leave empty for latest release."
        required: false
        type: string

concurrency:
  group: sync-desktop
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  sync:
    name: Sync Upstream Release to Desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: refs/heads/master
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        shell: bash
        run: |
          if [[ -n "$INPUT_UPSTREAM_TAG" ]]; then
            upstream_tag="$INPUT_UPSTREAM_TAG"
          else
            upstream_tag="$(gh release view --repo gokadzev/Musify --json tagName --jq '.tagName')"
          fi

          version="${upstream_tag#v}"
          release_tag="desktop-v${version}"

          echo "tag=${upstream_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="${{ steps.upstream.outputs.release_tag }}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $release_tag already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $release_tag does not exist; will sync"
          fi

      - name: Add upstream remote
        if: steps.existing.outputs.exists != 'true'
        run: |
          git remote add upstream https://github.com/gokadzev/Musify.git || git remote set-url upstream https://github.com/gokadzev/Musify.git
          git fetch upstream --no-tags --prune "+refs/tags/${{ steps.upstream.outputs.tag }}:refs/tags/${{ steps.upstream.outputs.tag }}"

      - name: Merge upstream release with auto-conflict resolution
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          upstream_tag="${{ steps.upstream.outputs.tag }}"
          
          echo "Attempting standard merge..."
          if git merge --no-edit "refs/tags/${upstream_tag}"; then
            echo "✅ Merge succeeded without conflicts"
            exit 0
          fi
          
          echo "⚠️  Conflicts detected; attempting -X ours strategy..."
          git merge --abort
          if git merge --no-edit -X ours "refs/tags/${upstream_tag}"; then
            echo "✅ Merge succeeded with -X ours strategy (preserved desktop changes)"
            exit 0
          fi
          
          echo "⚠️  -X ours failed; attempting -X theirs strategy..."
          git merge --abort
          if git merge --no-edit -X theirs "refs/tags/${upstream_tag}"; then
            echo "✅ Merge succeeded with -X theirs strategy (accepted upstream changes)"
            exit 0
          fi
          
          echo "❌ All merge strategies failed"
          git merge --abort
          exit 1

      - name: Refresh generated version
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          chmod +x update.sh
          ./update.sh
          if ! git diff --quiet lib/constants/version.dart; then
            git add lib/constants/version.dart
            git commit -m "chore: refresh version constant for ${{ steps.upstream.outputs.tag }}"
          fi

      - name: Validate merged state
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          if [[ -f pubspec.yaml ]]; then
            echo "Validating pubspec.yaml..."
            if ! grep -q '^version:' pubspec.yaml; then
              echo "❌ pubspec.yaml missing version field"
              exit 1
            fi
            echo "✅ pubspec.yaml validated"
          fi

      - name: Push merged branch
        if: steps.existing.outputs.exists != 'true'
        run: git push origin HEAD:refs/heads/master

      - name: Dispatch desktop release workflow
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.upstream.outputs.version }}"
          gh workflow run desktop_release.yml \
            --repo elias001011/Musify-Desktop-Port \
            --ref refs/heads/master \
            -f tag="desktop-v${version}" \
            -f source_ref="refs/heads/master" \
            -f repair_existing_release=false

      - name: Create issue on failure
        if: failure() && steps.existing.outputs.exists != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[SYNC FAILED] Desktop upstream sync failed for ${{ steps.upstream.outputs.tag }}',
              body: 'The automatic sync workflow failed to merge upstream ${{ steps.upstream.outputs.tag }} into the desktop master branch.\n\nPlease resolve conflicts manually and push to master.\n\nJob: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            })
