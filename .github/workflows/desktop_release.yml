name: Build Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag. Defaults to desktop-v<pubspec version>."
        required: false
        type: string
      source_ref:
        description: "Git ref/SHA to build. Defaults to the workflow ref."
        required: false
        type: string
      repair_existing_release:
        description: "Allow overwriting assets on an existing release."
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark the GitHub release as a prerelease."
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve release settings
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      target: ${{ steps.release.outputs.target }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      repair_existing_release: ${{ steps.release.outputs.repair_existing_release }}
      release_version: ${{ steps.release.outputs.release_version }}
      deb_revision: ${{ steps.release.outputs.deb_revision }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release settings
        id: release
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_SOURCE_REF: ${{ github.event.inputs.source_ref }}
          INPUT_REPAIR_EXISTING_RELEASE: ${{ github.event.inputs.repair_existing_release }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          source_ref="${INPUT_SOURCE_REF:-${GITHUB_SHA}}"
          repair_existing_release="${INPUT_REPAIR_EXISTING_RELEASE:-false}"
          if [[ "${repair_existing_release}" != "true" && "${repair_existing_release}" != "false" ]]; then
            echo "repair_existing_release must be true or false." >&2
            exit 1
          fi

          git checkout --detach "${source_ref}"

          version="$(sed -n 's/^version: \([^ +]*\).*/\1/p' pubspec.yaml)"

          if [[ -z "${version}" ]]; then
            echo "Could not resolve app version from pubspec.yaml." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            target="$(git rev-parse HEAD)"
            prerelease="false"
          else
            tag="${INPUT_TAG:-desktop-v${version}}"
            target="$(git rev-parse HEAD)"
            prerelease="${INPUT_PRERELEASE:-false}"
          fi

          expected_tag_pattern="^desktop-v${version}(-[0-9]+)?$"
          if [[ ! "${tag}" =~ ${expected_tag_pattern} ]]; then
            echo "Release tag ${tag} does not match pubspec.yaml version ${version}. Expected desktop-v${version} or desktop-v${version}-<revision>." >&2
            exit 1
          fi

          release_version="${tag#desktop-v}"
          deb_revision="${release_version#${version}-}"
          if [[ "${deb_revision}" == "${release_version}" ]]; then
            deb_revision="1"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "target=${target}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${source_ref}" >> "$GITHUB_OUTPUT"
          echo "repair_existing_release=${repair_existing_release}" >> "$GITHUB_OUTPUT"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "deb_revision=${deb_revision}" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_ref }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev dpkg-dev

      - name: Resolve Flutter version
        run: |
          flutter_version="$(sed -n 's/^  flutter: //p' pubspec.yaml | sed 's/^\^//')"
          echo "FLUTTER_VERSION=${flutter_version}" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "${{ env.FLUTTER_VERSION }}"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build Linux release
        run: |
          flutter build linux \
            --release \
            --dart-define=MUSIFY_CLOUD_SYNC_URL="${{ vars.MUSIFY_CLOUD_SYNC_URL }}" \
            --dart-define=MUSIFY_DESKTOP_RELEASE_TAG="${{ needs.preflight.outputs.tag }}"

      - name: Package Linux release
        env:
          DEB_REVISION: ${{ needs.preflight.outputs.deb_revision }}
        run: .github/scripts/package_linux_desktop.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: musify-linux-x64
          path: build/desktop-artifacts/Musify-linux-x64.*
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: preflight
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_ref }}

      - name: Resolve Flutter version
        shell: pwsh
        run: |
          $flutterVersion = Select-String -Path pubspec.yaml -Pattern '^\s+flutter:\s+\^?(.+)$'
          "FLUTTER_VERSION=$($flutterVersion.Matches[0].Groups[1].Value.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Resolve app version
        shell: pwsh
        run: |
          "MUSIFY_VERSION=${{ needs.preflight.outputs.release_version }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "${{ env.FLUTTER_VERSION }}"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Windows release
        run: |
          flutter build windows `
            --release `
            --dart-define=MUSIFY_CLOUD_SYNC_URL="${{ vars.MUSIFY_CLOUD_SYNC_URL }}" `
            --dart-define=MUSIFY_DESKTOP_RELEASE_TAG="${{ needs.preflight.outputs.tag }}"

      - name: Package portable Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\desktop-artifacts | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\desktop-artifacts\Musify-windows-x64-portable.zip -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" .github\installer\windows\musify.iss

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: musify-windows-x64
          path: build/desktop-artifacts/Musify-windows-x64-*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - preflight
      - build-linux
      - build-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_ref }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare checksums and notes
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          ls -lh dist
          required_assets=(
            "Musify-linux-x64.deb"
            "Musify-linux-x64.tar.gz"
            "Musify-windows-x64-setup.exe"
            "Musify-windows-x64-portable.zip"
          )

          for required_asset in "${required_assets[@]}"; do
            if [[ ! -f "dist/${required_asset}" ]]; then
              echo "Missing expected release artifact: ${required_asset}" >&2
              exit 1
            fi
          done

          sha256sum dist/* > dist/SHA256SUMS.txt

          cat > release-notes.md <<NOTES
          Musify Desktop Port ${RELEASE_TAG}

          Unofficial Windows and Linux desktop release based on upstream Musify.

          Desktop port changes:
          - Windows and Linux packaging for Musify.
          - Desktop speaker button with inline volume slider in the miniplayer and expanded player.
          - Desktop updater follows this repository's desktop-v* release channel.
          - Optional Cloud Sync for settings, playlists, liked songs, recently played songs, and most-played metadata.
          - Large cloud backups may be gzip-compressed inside a JSON envelope before upload.

          Assets:
          - Musify-linux-x64.deb: Debian/Ubuntu package.
          - Musify-linux-x64.tar.gz: portable Linux archive.
          - Musify-windows-x64-setup.exe: Windows installer.
          - Musify-windows-x64-portable.zip: portable Windows archive.
          - SHA256SUMS.txt: checksums for verification.

          The desktop updater checks releases from:
          https://github.com/elias001011/Musify-Desktop-Port/releases

          Cloud Sync setup docs:
          https://github.com/elias001011/Musify-Desktop-Port/blob/master/docs/cloud-sync.md

          Upstream Musify:
          https://github.com/gokadzev/Musify
          NOTES

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_TARGET: ${{ needs.preflight.outputs.target }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          REPAIR_EXISTING_RELEASE: ${{ needs.preflight.outputs.repair_existing_release }}
        run: |
          create_args=(--title "Musify Desktop Port ${RELEASE_TAG}" --notes-file release-notes.md)
          edit_args=(--title "Musify Desktop Port ${RELEASE_TAG}" --notes-file release-notes.md --draft=false)

          if [[ "${PRERELEASE}" == "true" ]]; then
            create_args+=(--prerelease)
            edit_args+=(--prerelease)
          else
            create_args+=(--latest)
            edit_args+=(--latest --prerelease=false)
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            if [[ "${REPAIR_EXISTING_RELEASE}" != "true" ]]; then
              echo "Release ${RELEASE_TAG} already exists. Refusing to overwrite it without repair_existing_release=true." >&2
              exit 1
            fi

            gh release upload "${RELEASE_TAG}" dist/* --clobber
            gh release edit "${RELEASE_TAG}" "${edit_args[@]}" --target "${RELEASE_TARGET}"
            exit 0
          fi

          gh release create "${RELEASE_TAG}" dist/* \
            "${create_args[@]}" \
            --target "${RELEASE_TARGET}"
